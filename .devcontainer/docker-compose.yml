services:
  promptsploit_dev:
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - promptsploit_cache:/home/node/.promptfoo/
      - promptsploit_npm_global:/home/node/.npm-global
    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: sleep infinity

volumes:
  promptsploit_cache:
  promptsploit_npm_global:
